<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>VAPID Push Subscription</title>
	</head>
	<body>
		<h2>Test VAPID OTP Verification</h2>

		<!-- Form to take user input for telephone number and OTP -->
		<form id="otpForm">
			<label for="telephoneNumber">Telephone Number:</label>
			<input
				type="text"
				id="telephoneNumber"
				name="telephoneNumber"
				required />
			<br />
			<br />
			<label for="otp">OTP:</label>
			<input
				type="text"
				id="otp"
				name="otp"
				required />
			<br />
			<br />
			<button
				type="button"
				onclick="init()">
				Subscribe & Send OTP
			</button>
		</form>

		<pre id="output"></pre>

		<script>
			const VAPID_PUBLIC_KEY = "BE5QhoMfwWnqqXxvgYo-810Db-vzC2UkpPKwkAeKXMn1c6Uc64zDUmd-d6kSCOePbkcJpukFGV_sA9OGlrDcLTI"; // Replace with your real VAPID public key

			function urlBase64ToUint8Array(base64String) {
				const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
				const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
				const rawData = window.atob(base64);
				const outputArray = new Uint8Array(rawData.length);
				for (let i = 0; i < rawData.length; ++i) {
					outputArray[i] = rawData.charCodeAt(i);
				}
				return outputArray;
			}

			async function init() {
				// Get values from the form inputs
				const telephoneNumber = document.getElementById("telephoneNumber").value;
				const otp = document.getElementById("otp").value;

				if (!telephoneNumber || !otp) {
					document.getElementById("output").textContent = "Please enter both telephone number and OTP.";
					return;
				}

				try {
					// Register the service worker
					const registration = await navigator.serviceWorker.register("./sw.js");

					// Wait for the service worker to activate (to ensure it's fully ready)
					await new Promise((resolve, reject) => {
						if (registration.active) {
							resolve();
						} else {
							registration.addEventListener("statechange", function (event) {
								if (event.target.state === "activated") {
									resolve();
								}
							});
						}
					});

					// Request notification permission
					const permission = await Notification.requestPermission();
					if (permission !== "granted") {
						document.getElementById("output").textContent = "Notification permission denied.";
						return;
					}

					// Subscribe to push notifications
					const subscription = await registration.pushManager.subscribe({
						userVisibleOnly: true,
						applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
					});

					// Prepare payload
					const payload = {
						telephoneNumber: telephoneNumber,
						otp: otp,
						subscription: subscription.toJSON(), // Important: convert to plain object
					};

					// Send to your backend
					const response = await fetch("http://api.storytime.ng/v1/auth/verify", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
							Accept: "*/*",
						},
						body: JSON.stringify(payload),
					});

					const data = await response.json();
					document.getElementById("output").textContent = JSON.stringify(data, null, 2);

					// Console log the response data
					console.log("Response from backend:", data);
				} catch (err) {
					document.getElementById("output").textContent = `Error: ${err.message}`;
				}
			}
		</script>
	</body>
</html>
