<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>VAPID Push Subscription</title>
	</head>
	<body>
		<h2>Test VAPID OTP Verification</h2>
		<button onclick="init()">Subscribe & Send OTP</button>
		<pre id="output"></pre>

		<script>
			const VAPID_PUBLIC_KEY = "BE5QhoMfwWnqqXxvgYo-810Db-vzC2UkpPKwkAeKXMn1c6Uc64zDUmd-d6kSCOePbkcJpukFGV_sA9OGlrDcLTI"; // Replace with your real VAPID public key

			function urlBase64ToUint8Array(base64String) {
				const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
				const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
				const rawData = window.atob(base64);
				const outputArray = new Uint8Array(rawData.length);
				for (let i = 0; i < rawData.length; ++i) {
					outputArray[i] = rawData.charCodeAt(i);
				}
				return outputArray;
			}

			async function init() {
				try {
					// Register the service worker
					await navigator.serviceWorker.register("./sw.js");

					// Wait until it becomes active
					const registration = await navigator.serviceWorker.ready;

					// Request notification permission
					const permission = await Notification.requestPermission();
					if (permission !== "granted") {
						document.getElementById("output").textContent = "Notification permission denied.";
						return;
					}

					// Subscribe to push notifications
					const subscription = await registration.pushManager.subscribe({
						userVisibleOnly: true,
						applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
					});

					// Prepare payload
					const payload = {
						telephoneNumber: "+2348164664465",
						otp: "123456",
						subscription: subscription.toJSON(), // Important: convert to plain object
					};

					// Send to your backend
					const response = await fetch("http://api.storytime.ng/v1/auth/verify", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
							Accept: "*/*",
						},
						body: JSON.stringify(payload),
					});

					const data = await response.json();
					document.getElementById("output").textContent = JSON.stringify(data, null, 2);
				} catch (err) {
					document.getElementById("output").textContent = `Error: ${err.message}`;
				}
			}
		</script>
	</body>
</html>
