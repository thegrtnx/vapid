<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>VAPID Push Subscription</title>
	</head>
	<body>
		<h2>Test VAPID OTP Verification</h2>
		<button onclick="init()">Subscribe & Send OTP</button>
		<pre id="output"></pre>

		<script>
			const VAPID_PUBLIC_KEY = "BE5QhoMfwWnqqXxvgYo-810Db-vzC2UkpPKwkAeKXMn1c6Uc64zDUmd-d6kSCOePbkcJpukFGV_sA9OGlrDcLTI"; // Base64-encoded

			async function urlBase64ToUint8Array(base64String) {
				const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
				const base64 = (base64String + padding).replace(/\-/g, "+").replace(/_/g, "/");
				const rawData = atob(base64);
				const outputArray = new Uint8Array(rawData.length);
				for (let i = 0; i < rawData.length; ++i) {
					outputArray[i] = rawData.charCodeAt(i);
				}
				return outputArray;
			}

			async function init() {
				try {
					const registration = await navigator.serviceWorker.register("./sw.js");
					const subscription = await registration.pushManager.subscribe({
						userVisibleOnly: true,
						applicationServerKey: await urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
					});

					// Send to backend
					const payload = {
						telephoneNumber: "+2348164664465",
						otp: "123456",
						subscription,
					};

					const response = await fetch("http://localhost:3300/v1/auth/verify", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
							Accept: "*/*",
						},
						body: JSON.stringify(payload),
					});

					const data = await response.json();
					document.getElementById("output").textContent = JSON.stringify(data, null, 2);
				} catch (err) {
					document.getElementById("output").textContent = `Error: ${err.message}`;
				}
			}
		</script>
	</body>
</html>
